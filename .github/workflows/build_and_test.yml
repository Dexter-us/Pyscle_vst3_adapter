name: Pamplejuce-Windows-Build

on:
  workflow_dispatch:
  push:
  pull_request:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  BUILD_DIR: Builds
  SCCACHE_GHA_ENABLED: true
  SCCACHE_CACHE_MULTIARCH: 1

defaults:
  run:
    shell: bash

jobs:
  build_windows:
    name: Windows VST3 Compiler
    runs-on: windows-latest
    
    steps:
      - name: Setup MSVC Toolchain
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install IPP Dependency
        run: nuget install intelipp.static.win-x64 -Version 2026.0.0.712

      - name: Install Ninja Build Engine
        run: choco install ninja

      - name: Checkout Repository Source
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Cache Build Data
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure Project with CMake
        run: |
          cmake -B ${{ env.BUILD_DIR }} \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -G Ninja -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl .

      - name: Execute C++ Compilation
        run: cmake --build ${{ env.BUILD_DIR }} --config ${{ env.BUILD_TYPE }}

      - name: Package Raw Artifact Outputs
        run: |
          mkdir -p final_output
          cp -r ${{ env.BUILD_DIR }}/*_artefacts/Release/VST3/ final_output/ || true

      - name: Upload Compiled VST3 Adapter Bundle
        uses: actions/upload-artifact@v7
        with:
          name: Psycle-VST3-Adapter-Windows
          path: final_output/
